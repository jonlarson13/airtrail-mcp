name: Dependabot MCPB Build

on:
  push:
    branches:
      - "dependabot/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package MCPB bundle
        run: npx mcpb pack . airtrail-mcp-dev.mcpb

      - name: Upload MCPB artifact
        uses: actions/upload-artifact@v7
        with:
          name: airtrail-mcp-dev.mcpb
          path: airtrail-mcp-dev.mcpb
